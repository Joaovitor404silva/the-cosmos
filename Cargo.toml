[workspace]
resolver = "2"
members = ["crates/cosmos-core", "crates/cosmos-ffi", "crates/cosmos-net", "crates/cosmos-steam"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# Argon2 join-code hashing is unusably slow unoptimized.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
