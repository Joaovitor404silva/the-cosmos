[package]
name = "cosmos-net"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
libp2p = { version = "0.57.1", features = ["tokio", "tcp", "quic", "noise", "yamux", "identify", "kad", "gossipsub", "mdns", "autonat", "relay", "dcutr", "upnp", "ping", "macros", "ed25519", "rsa", "dns"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
futures = "0.3"
sha2 = "0.10"
anyhow = "1"
tracing = "0.1"
ureq = "3"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "test-util", "io-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
